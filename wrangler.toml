name = "acd-academy"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./dist"

# Static site output from `astro build`. Lets Cloudflare's
# `npx wrangler deploy` upload dist/ instead of looking for a Worker script.
[assets]
directory = "./dist"
not_found_handling = "404-page"

# Pages Functions in /functions need this D1 binding named DB.
# `YOUR_D1_DATABASE_ID` is a placeholder until you run:
#   npx wrangler d1 create acd-game-scores
[[d1_databases]]
binding = "DB"
database_name = "acd-game-scores"
database_id = "YOUR_D1_DATABASE_ID"
